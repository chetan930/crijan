# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: crijan-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: crijan-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: crijan-shared-config
  namespace: crijan-core
data:
  PREVIEW_DOMAIN: "previews.crijan.in"
  PREVIEW_NAMESPACE: "crijan-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "https://crijan.in"
