apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: chetancrijanpvtltd@gmail.com
    privateKeySecretRef:
      name: letsencrypt-dns-prod-key
    solvers:
      - dns01:
          cloudflare:    # UPDATED: Swapped from cloudDNS to cloudflare
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
