apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crijan-main-ingress
  namespace: crijan-core
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # --- CORS FIX STARTS HERE ---
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://crijan.in, https://www.crijan.in"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With, X-Forwarded-For"

    # This ensures the backend knows the original request was HTTPS
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "crijan.in"
        - "www.crijan.in"
        - "api.crijan.in"
        - "*.crijan.in"  # CHANGED: Updated TLS host scope
        # - "*.previews.crijan.in"
      secretName: crijan-tls-secret
  rules:
    - host: "crijan.in"
      http: &http_rules
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crijan-frontend
                port: { number: 80 }
    - host: "www.crijan.in"
      http: *http_rules
    - host: "api.crijan.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 80 }
    # - host: "*.previews.crijan.in"
    - host: "*.crijan.in"  # CHANGED: Catches all preview subdomains cleanly
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crijan-me-proxy
                port: { number: 80 }
