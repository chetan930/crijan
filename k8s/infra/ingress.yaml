apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crijan-main-ingress
  namespace: crijan-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "nginx"
  rules:
    # 1. Main Website Route (The Frontend!)
    - host: "crijan.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crijan-frontend
                port:
                  number: 80

    - host: "www.crijan.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crijan-frontend
                port:
                  number: 80

    # 2. Previews Route
    - host: "*.previews.crijan.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crijan-me-proxy
                port:
                  number: 80

    # 3. API Gateway Route
    - host: "api.crijan.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
