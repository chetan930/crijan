name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "crijan-frontend/**" 
      - ".github/workflows/deploy-account-service.yaml" # (Optional) triggers when the workflow itself changes
  workflow_dispatch: # <-- THIS ADDS THE MANUAL BUTTON

env:
  SERVICE_NAME: crijan-frontend
  IMAGE_NAME: chetan930/crijan-frontend

permissions:
  id-token: write 
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to Oracle K3s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Docker to allow building linux/arm64 images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Login to DockerHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and Push the Docker Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./crijan-frontend 
          platforms: linux/arm64  # ✅ CHANGED THIS TO ARM64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # 4. Configure Kubernetes Access via Secret
      - name: Configure Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # 5. Deploy directly to your new K3s server
      - name: Deploy to K3s
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
          ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n crijan-core

          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n crijan-core
