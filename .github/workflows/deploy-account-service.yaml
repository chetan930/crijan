name: Deploy Account Service

on:
  push:
    branches:
      - main
    paths:
      - "account-service/**"
      - ".github/workflows/deploy-account-service.yaml" # (Optional) triggers when the workflow itself changes
  workflow_dispatch: # <-- THIS ADDS THE MANUAL BUTTON

env:
  SERVICE_NAME: account-service
  IMAGE_NAME: chetan930/crijan-account-service

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to Oracle K3s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Fix mvnw permissions
        run: chmod +x */mvnw

      - name: Build and Install Common Library
        working-directory: ./common-library
        run: ./mvnw clean install -DskipTests

      # ✅ Added the ARM64 platform flag to your Jib build
      - name: Build and Push Docker Image with Jib (ARM64)
        working-directory: ./${{ env.SERVICE_NAME }}
        run: |
          ./mvnw compile jib:build \
            -Djib.from.platforms=linux/arm64 \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ Replaced GKE Authentication with Oracle K3s Secret
      - name: Configure Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # ✅ Deploy directly to your new server
      - name: Deploy to K3s
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
          ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n crijan-core

          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n crijan-core
