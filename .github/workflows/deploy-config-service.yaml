name: Deploy Config Service

on:
  push:
    branches:
      - main
    paths:
      - "config-service/**"
      - ".github/workflows/deploy-config-service.yaml" # (Optional) triggers when the workflow itself changes
  workflow_dispatch: # <-- THIS ADDS THE MANUAL BUTTON

env:
  SERVICE_NAME: config-service
  IMAGE_NAME: chetan930/crijan-config-service

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to Oracle K3s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./${{ env.SERVICE_NAME }}/mvnw

      # ✅ Added the ARM64 platform flag for Jib
      - name: Build and Push Docker Image with Jib (ARM64)
        working-directory: ./${{ env.SERVICE_NAME }}
        run: |
          ./mvnw compile jib:build \
            -Djib.from.platforms=linux/arm64 \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ Replaced GKE Authentication with Oracle K3s Secret
      - name: Configure Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

    # ✅ Deploy directly to your new server
      - name: Deploy to K3s
        run: |
          # 1. Apply your base Kubernetes files (creates it if it doesn't exist)
          # IMPORTANT: Update "k8s/" below if your files are in a specific subfolder
          kubectl apply -f k8s/ -R -n crijan-core

          # 2. Inject the brand new Docker image we just built
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
          ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n crijan-core

          # 3. Wait for the pods to boot up
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n crijan-core
